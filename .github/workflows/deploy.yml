# 가장 쉬운 자동 배포: Vercel 대시보드 → mimisalon 프로젝트 → Settings → Git
#   → GitHub 저장소 연결, Production Branch = main
#   → 이후 main 에 push 할 때마다 Vercel이 알아서 빌드·배포 (Secrets 불필요)
#
# 아래 워크플로는 수동 실행용(Actions 탭 → Run workflow). 평소엔 끄고 두어도 됨.
name: Deploy to Vercel (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: EvanNotFound/vercel-deployment-for-github-actions@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: koobg9-ms-projects
          PRODUCTION: true
