# main/master 에 push 하면 Vercel 프로덕션 자동 배포
# 필요: GitHub 저장소 Settings → Secrets → VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# (Secrets 미설정 시 워크플로만 실패함. Vercel 대시보드에서 Git 연동만 켜도 동일하게 자동 배포됨.)
name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: EvanNotFound/vercel-deployment-for-github-actions@v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_SCOPE: koobg9-ms-projects
          PRODUCTION: true
